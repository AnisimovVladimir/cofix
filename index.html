<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cofix Demo — Contacts (SVG icons) + Video</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">cofix<span>®</span></div>
    </div>
  </header>
  <main id="main">
    <section class="hero" aria-label="Demo hero" style="padding:0; text-align:center; position:relative; overflow:hidden;">
      <video class="hero-video" autoplay muted loop playsinline poster="assets/hero-poster.webp" aria-label="Демонстрационное видео">
        <source src="assets/videos/demo-hero.mp4" type="video/mp4">
        <source src="assets/videos/demo-hero.webm" type="video/webm">
        Ваш браузер не поддерживает видео
      </video>
      <div class="hero-overlay" aria-hidden="true"></div>
      <div class="hero-content container" style="position: absolute; left:0; right:0; bottom:20px; text-align:center; z-index:1; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5);">
        <h1 style="margin:0; font-size:26px;">Учебный Cofix — демо-версия</h1>
        <p style="margin:6px 0 0;">Видео-пример и демо-формы вместо реального контента</p>
      </div>
    </section>

    <section id="contacts-demo" aria-label="Demo контакты Cofix" class="contacts-demo" style="margin:20px auto; max-width:720px; padding:16px;">
      <div class="container">
        <h3>Демо-ссылки на мессенджеры</h3>
        <p class="demo-note" style="font-size:14px; margin:6px 0 12px;">Это демо‑ссылки — не реальные контакты Cofix.</p>
        <div class="contact-social-demo" aria-label="Демо-соцсети">
          <a href="https://vk.com/" target="_blank" rel="noopener" aria-label="ВКонтакте">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.5 7.5h-2.5c-.8 0-1.5.7-1.5 1.5v2c0 .4-.3.7-.7.7H9v2.2h2.8v4.3h3.2V14.5h1.6l.8-2.9h-2.4V9.7c0-.8.6-1.2 1.3-1.2h1.8v-2z"/></svg>
            ВКонтакте
          </a>
          <a href="https://t.me/" target="_blank" rel="noopener" aria-label="Telegram">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 21l21-9L8 12l2-6-8 8 5-2 7 17-20-11z"/></svg>
            Telegram
          </a>
          <a href="https://wa.me/" target="_blank" rel="noopener" aria-label="WhatsApp">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12c0 3.7 1.8 7 4.8 9.2L4 22l1.8-2.2C7.5 21 9.7 22 12 22c5.5 0 10-4.5 10-10S17.5 2 12 2zm-1 5h2v6h-2V7zm4 0h2v6h-2V7z"/></svg>
            WhatsApp
          </a>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer" style="text-align:center; padding:20px; color:#666;">Demo only</footer>
</body>
</html>
